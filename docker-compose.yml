version: "3.9"  # optional since v1.27.0
services:
  frontend:
    build: ./Frontend/frontend/
    ports:
        - "8080:80"

  MySQL:
    image: mysql:8.4
    restart: always
    environment:
      MYSQL_DATABASE: 'db'
      MYSQL_USER: 'root'
      MYSQL_PASSWORD: 'password'
      MYSQL_ROOT_PASSWORD: 'password'
    ports:
      - '3306:3306'
    expose:
      - '3306'
    volumes:
      - my-db:/var/lib/mysql

  backend:
    build: .
    ports:
      - "57693:57693"
    depends_on:
      MySQL:
        condition: service_started
volumes:
  my-db: